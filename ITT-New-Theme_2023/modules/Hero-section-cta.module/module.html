<style>
  .cta-button{
    {{ module.style.spacing_field.css }}
  }
</style>

<div class="cta-button">
  <div class="d-flex {{ module.style.alignment }}">
    <!-- button option 1 start -->
    <div class="itt-btn-option-1 w-auto">
      {% set href = module.link_field.url.href %} {% if
      module.link_field.url.type is equalto "EMAIL_ADDRESS" %} {% set href =
      "mailto:" + href %} {% endif %}
      <a
        href="{{ href }}"
        class="btn itt-btn-primary large"
        {%
        if
        module.link_field.open_in_new_tab
        %}target="_blank"
        {%
        endif
        %}
        {%
        if
        module.link_field.rel
        %}rel="{{ module.link_field.rel }}"
        {%
        endif
        %}
      >
        {{ module.contact_now_button }}
      </a>
    </div>
    <!-- button option 1 end -->    
  </div>
</div>
